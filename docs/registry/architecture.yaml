#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: orquestrador_como_autoload
    status: active
    description: "O orquestrador do passo não é um Autoload. O Main, nó fino da cena raiz, o constrói e injeta nos módulos."
    why: "Singleton global quebra o teste em memória e deixa qualquer módulo pedir transição de estado."
    adr: docs/architecture/adr-0001-orquestrador-do-passo.md
    added: 2026-11-13
  - pattern: scenetree_paused_para_pausar_jogo
    status: active
    description: "Não usar SceneTree.paused para pausar, congelar ou fazer hitstop. A pausa é o estado PAUSA do orquestrador."
    why: "A engine pararia também a UI da Bênção, os menus e o Pipeline, que precisam continuar vivos."
    adr: docs/architecture/adr-0001-orquestrador-do-passo.md
    added: 2026-11-13
  - pattern: engine_time_scale_para_hitstop
    status: active
    description: "Não usar Engine.time_scale para hitstop nem para pausar. Hitstop é contador de passos, guardado pelo Combate."
    why: "time_scale escala todos os relógios, inclusive os de apresentação, e quebra a contagem em passos inteiros (Combate R10)."
    adr: docs/architecture/adr-0001-orquestrador-do-passo.md
    added: 2026-11-13
  - pattern: timer_na_logica_de_jogo
    status: active
    description: "A lógica de jogo não usa Timer nem SceneTree.create_timer. O tempo é contagem de passos; esperas de apresentação usam t_apres ou t_vivo."
    why: "Esses relógios correm no tempo real da engine e não param em hitstop, pausa nem Bênção."
    adr: docs/architecture/adr-0001-orquestrador-do-passo.md
    added: 2026-11-13
  - pattern: ordem_do_passo_por_process_priority
    status: active
    description: "Nenhum módulo de jogo tem _physics_process próprio nem ordem por process_priority. A ordem do passo é a do orquestrador."
    why: "A ordem dos 10 itens do passo é determinística e crítica, e deve ficar legível e testável num só lugar."
    adr: docs/architecture/adr-0001-orquestrador-do-passo.md
    added: 2026-11-13
  - pattern: barramento_de_eventos_autoload
    status: active
    description: "Não há event bus global (Autoload com publicar/assinar por nome). Eventos passam pela lista EventosDoPasso, injetada."
    why: "Singleton global, sem tipo, ordem de assinantes implícita e difícil de testar em memória."
    adr: docs/architecture/adr-0002-canal-de-eventos.md
    added: 2026-11-13
  - pattern: sinal_do_godot_entre_modulos_de_regra
    status: active
    description: "Módulos de regra não se comunicam por sinais do Godot. Usam a lista do passo (notificação) ou chamada direta injetada (controle). Sinais só nos nós de Apresentação."
    why: "A ordem de chamada dos conectados não está na referência da engine e esconderia a ordem do passo dentro da ordem de conexão."
    adr: docs/architecture/adr-0002-canal-de-eventos.md
    added: 2026-11-13
  - pattern: evento_com_node_ou_referencia_de_volta
    status: active
    description: "Um EventoDoPasso guarda só dados (valores e identificadores). Nunca Node, nem referência ao EventosDoPasso, ao módulo emissor ou a outro evento."
    why: "RefCounted não tem coletor de ciclos: uma referência de volta vaza; Node vivo no payload quebra o teste em memória."
    adr: docs/architecture/adr-0002-canal-de-eventos.md
    added: 2026-11-13
  - pattern: consumidor_da_apresentacao_emite_evento
    status: active
    description: "HUD, Feedback e Telemetria só leem. Não chamam emitir() nem escrevem em estado de jogo durante a entrega."
    why: "Preserva o princípio de que a Apresentação nunca altera o jogo; emitir() erra em debug durante a entrega."
    adr: docs/architecture/adr-0002-canal-de-eventos.md
    added: 2026-11-13

