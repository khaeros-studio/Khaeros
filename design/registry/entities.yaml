    notes: "F1 de Câmaras. Limiar (r = 0, p 0–4): 3,0 a 6,6; Veio Instável (r = 1): 5,0 a 8,6."
    added: 2026-11-11
    revised: ""
  - name: elite_chance
    status: active
    source: design/gdd/ia-de-inimigos-e-elites.md
    referenced_by:
      - design/gdd/ia-de-inimigos-e-elites.md
      - design/gdd/camaras-e-ondas.md   # chama sortear_elite(p, ja_ha_elite) por inimigo
      - design/gdd/conteudo-orientado-a-dados.md   # F8, LinearCurveDef (EliteRules)
    variables:
      - p
      - elite_prof_min
    output_range: [0, 0.25]
    expression: "chance(p) = 0 se p < elite_prof_min ; senão min(0,25 ; 0,05 + 0,02 × p) ; máx. 1 elite por onda ; 1 real por inimigo, sempre"
    notes: "F1 de IA. Com p_max 4 do Limiar: p 3 = 11%, p 4 = 13%."
    added: 2026-11-11
    revised: ""
  - name: door_fragments_reward
    status: active
    source: design/gdd/portas-e-recompensas.md
    referenced_by:
      - design/gdd/portas-e-recompensas.md
      - design/gdd/economia-de-fragmentos.md   # origem porta: creditar(porta, n)
    variables:
      - p
      - fragmentos_base
      - fragmentos_passo_prof
    output_range: [2, 3]
    expression: "fragmentos(p) = fragmentos_base + floor(p / fragmentos_passo_prof) ; p = profundidade da câmara limpa"
    notes: "F1 de Portas. 2, 2, 2, 3, 3 nas câmaras p 0–4; sem teto se p > p_max."
    added: 2026-11-11
    revised: ""
  - name: door_heal_reward
    status: active
    source: design/gdd/portas-e-recompensas.md
    referenced_by:
      - design/gdd/portas-e-recompensas.md
      - design/gdd/camaras-e-ondas.md   # PV4: cura da porta deve ser < santuario_cura
    variables:
      - Vida_max
      - cura_pct
    output_range: [0, 100]
    expression: "cura = round(Vida_max × cura_pct) ; Vida' = min(Vida_max, Vida + cura)"
    notes: "Portas R5/F-cura. 30 com a Lâmina (100) e 24 com a Ressonância (80). Santuário cura 40% (Câmaras R12)."
    added: 2026-11-11
    revised: ""

