# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: weapon_hit_damage
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - dano
      - combo
      - passo_combo
      - m_sem
      - m_com
      - contador_acertos
      - a_cada
    output_range: [0, 1000000]
    expression: "AttackDef.dano * combo[passo_combo mod n] * (quarto ? M_com : M_sem)"
    notes: "F1 do Combate. Combo por slot; M avaliado no disparo (M_sem sem enesimo_acerto, M_com com); quarto acerto decidido por alvo no impacto, contador +1 antes do teste."
    added: 2026-11-09
    revised: ""
  - name: attack_recovery
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - recarga_passos
      - fator_recuperacao_golpe
      - recuperacao_max_passos
    output_range: [0, 30]
    expression: "forma == avanco ? 0 : min(recuperacao_max_passos, round(recarga_passos * fator_recuperacao_golpe))"
    notes: "F2 do Combate. Recarga base do AttackDef; o jogador anda lento rec - 1 passos (desconto antes do Movimento)."
    added: 2026-11-09
    revised: ""
  - name: finisher_knockback
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - combo_mult
      - limiar_finalizador
      - empurrao
      - empurrao_pesado
      - fator_empurrao
    output_range: [0, 100000]
    expression: "(c > limiar ? max(empurrao * c, empurrao_pesado) : empurrao) * fator_empurrao_alvo"
    notes: "F3 do Combate. Golpe pesado = finalizador, quarto acerto ou empurrão de entrada >= empurrao_pesado (antes do fator do alvo)."
    added: 2026-11-09
    revised: ""
  - name: knockback_travel
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - v0
      - queda_empurrao
      - empurrao_zero
    output_range: [0, 100000]
    expression: "n = max(1, floor(ln(z/v0)/ln(q)) + 1); dist = (v0/60) * (1 - q^n) / (1 - q)"
    notes: "F7 do Combate. Empurrão cumulativo (soma vetorial), anda v/60, depois v *= q, zera abaixo de z. dist < v0 / (60 * (1 - q))."
    added: 2026-11-09
    revised: ""
  - name: wall_slam
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - v_antes
      - parede_vel_min
      - parede_dano
      - m_parede
    output_range: [0, 1000000]
    expression: "corrigida && v_antes >= parede_vel_min ? parede_dano * M_parede : 0"
    notes: "F8 do Combate. Corrigida = parede ou obstáculo (não a separação entre inimigos). M grupo Ataque, sem apos_esquiva nem quarto acerto; hitstop leve; empurrão zera."
    added: 2026-11-09
    revised: ""
  - name: hitstop_total
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - pedidos_do_passo
    output_range: [0, 90]
    expression: "h = max(pedidos do passo); congelado = soma de h"
    notes: "F9 do Combate. Vale o maior (cânone; fecha D-N1 do cross-review 06b). Congela a partir do passo seguinte; contador sem time_scale (Cena R7)."
    added: 2026-11-09
    revised: ""
  - name: weapon_dps_ref
    status: active
    source: design/gdd/combate-nucleo.md
    referenced_by:
      - design/gdd/combate-nucleo.md
    variables:
      - dano
      - combo
      - recarga_passos
      - janela_combo
      - m
      - hitstops
    output_range: [0, 100000]
    expression: "DPS_real = dano * M * soma(combo) * 60 / (n * R + soma(h_i))"
    notes: "F11 do Combate. Referência de balanceamento: Corte com combo 53,2/s real, Pulso 51,4/s."
    added: 2026-11-09
    revised: ""

