name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run GdUnit4 Tests
    runs-on: ubuntu-latest
    # The action publishes its results as a check run. A new repository's
    # token is read-only, and without checks: write the job fails even when
    # every test passes. If you protect main, require the `Run GdUnit4 Tests` job
    # check, not `test-results`: that check run concludes success even when a
    # test fails.
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Story RNG-006 (AC-32, ADR-0005): lint contra RNG da engine em src/.
      # Exit 1 = violação; exit 2 = NOT ASSESSED (zero arquivos varridos).
      - name: Lint RNG (AC-32)
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT=godot-bin/Godot_v4.7.2-stable_linux.x86_64
          $GODOT --headless --path . --import || true
          $GODOT --headless --path . --script res://tools/ci/lint_rng.gd
          rm -rf godot.zip godot-bin

      # godot-version must be a full release (godot --version shows 4.7.2).
      # version: installed runs the gdUnit4 committed in addons/ -- without it
      # the action deletes that copy and installs the latest release.
      - name: Run GdUnit4 Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'
          paths: |
            tests/unit
            tests/integration
          report-name: test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/
